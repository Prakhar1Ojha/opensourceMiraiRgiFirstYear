name: PR Review & Approval Automation

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    name: Contributor Triage & Review Routing
    runs-on: ubuntu-latest

    steps:
      - name: Process PR Review & Approval Flow
        uses: actions/github-script@v7
        with:
          script: |
            const targetReviewers = ['sapnilbiswas', 'dhruveshmishra'];
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const action = context.payload.action;

            // Fetch current labels on the PR
            const currentLabels = (pr.labels || []).map(l => l.name.toLowerCase());
            const hasContributorTag = currentLabels.includes('contributor') || currentLabels.includes('contributor tagged');
            const authorAssoc = pr.author_association; // FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE, CONTRIBUTOR, etc.
            const isFirstTimer = authorAssoc === 'FIRST_TIME_CONTRIBUTOR' || authorAssoc === 'FIRST_TIMER' || authorAssoc === 'NONE';

            core.info(`PR #${prNumber} by ${prAuthor} (association: ${authorAssoc}). Action: ${action}. Has contributor tag: ${hasContributorTag}`);

            if (hasContributorTag) {
              core.info(`PR #${prNumber} is tagged as contributor. Fast-tracking and auto-approving...`);

              // Remove 'needs-review' if present
              if (currentLabels.includes('needs-review')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    name: 'needs-review'
                  });
                } catch (e) {
                  core.warning(`Could not remove needs-review label: ${e.message}`);
                }
              }

              // Add 'contributor-approved' label
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['contributor-approved']
                });
              } catch (e) {
                core.warning(`Could not add contributor-approved label: ${e.message}`);
              }

              // Automatically submit an approval review
              try {
                const reviews = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                const botUser = context.actor;
                const alreadyApproved = reviews.data.some(r => r.state === 'APPROVED');

                if (!alreadyApproved) {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    event: 'APPROVE',
                    body: '🎉 **Automated Approval**: This PR has the `contributor` tag and is approved for merge once all CI quality gates pass.'
                  });
                  core.info(`Auto-approved PR #${prNumber}.`);
                }
              } catch (e) {
                core.warning(`Could not submit automated review approval: ${e.message}`);
              }

            } else if (isFirstTimer || action === 'opened') {
              core.info(`PR #${prNumber} is from a first-time contributor. Routing for maintainer approval...`);

              // Add tracking labels
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ['first-time-contributor', 'needs-review']
                });
              } catch (e) {
                core.warning(`Could not apply labels: ${e.message}`);
              }

              // Filter reviewers so author is not asked to review their own PR
              const assignableReviewers = targetReviewers.filter(
                username => username.toLowerCase() !== prAuthor.toLowerCase()
              );

              if (assignableReviewers.length > 0) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    reviewers: assignableReviewers
                  });
                  core.info(`Requested reviews from: ${assignableReviewers.join(', ')}`);
                } catch (e) {
                  core.warning(`Could not request reviewers: ${e.message}`);
                }
              }

              // Post welcoming message on PR open
              if (action === 'opened') {
                try {
                  const mentionList = assignableReviewers.map(u => `@${u}`).join(' and ');
                  const welcomeBody = `👋 Welcome @${prAuthor}! Thank you for opening your first pull request on the **OSS Shopping Cart** project!\n\n` +
                    `🔍 Maintainer review has been requested from ${mentionList}.\n\n` +
                    `📋 **Next steps:**\n` +
                    `- Ensure CI checks pass (formatting, linting, tests).\n` +
                    `- Once verified by a maintainer, you will be tagged with the \`contributor\` label for future automated approvals! 🚀`;

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: welcomeBody
                  });
                } catch (e) {
                  core.warning(`Could not post welcome comment: ${e.message}`);
                }
              }
            }
