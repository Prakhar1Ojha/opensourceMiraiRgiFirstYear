name: PR Review & Contributor Triage

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    name: Contributor Triage & Review Routing
    runs-on: ubuntu-latest

    steps:
      - name: Process PR Review Routing & Triage Flow
        uses: actions/github-script@v7
        with:
          script: |
            const targetReviewers = ['sapnilbiswas', 'dhruveshmishra'];
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const action = context.payload.action;

            // Fetch current labels on the PR
            const currentLabels = (pr.labels || []).map(l => l.name.toLowerCase());
            const hasContributorTag = currentLabels.includes('contributor') || currentLabels.includes('contributor tagged');
            const authorAssoc = pr.author_association; // FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE, CONTRIBUTOR, etc.
            const isFirstTimer = authorAssoc === 'FIRST_TIME_CONTRIBUTOR' || authorAssoc === 'FIRST_TIMER' || authorAssoc === 'NONE';

            core.info(`PR #${prNumber} by ${prAuthor} (association: ${authorAssoc}). Action: ${action}. Has contributor tag: ${hasContributorTag}`);

            // Determine labels to apply
            const labelsToAdd = [];

            // All PRs need review from maintainers
            if (!currentLabels.includes('needs-review')) {
              labelsToAdd.push('needs-review');
            }

            if (hasContributorTag || authorAssoc === 'CONTRIBUTOR') {
              core.info(`PR #${prNumber} is from a recognized contributor. Routing for maintainer review without auto-approval...`);
              if (!currentLabels.includes('contributor')) {
                labelsToAdd.push('contributor');
              }
            } else if (isFirstTimer) {
              core.info(`PR #${prNumber} is from a first-time contributor. Routing for maintainer review...`);
              if (!currentLabels.includes('first-time-contributor')) {
                labelsToAdd.push('first-time-contributor');
              }
            }

            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: labelsToAdd
                });
                core.info(`Applied labels: ${labelsToAdd.join(', ')}`);
              } catch (e) {
                core.warning(`Could not apply labels: ${e.message}`);
              }
            }

            // Request maintainer reviews (excluding author)
            const assignableReviewers = targetReviewers.filter(
              username => username.toLowerCase() !== prAuthor.toLowerCase()
            );

            if ((action === 'opened' || action === 'reopened') && assignableReviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: assignableReviewers
                });
                core.info(`Requested reviews from: ${assignableReviewers.join(', ')}`);
              } catch (e) {
                core.warning(`Could not request reviewers: ${e.message}`);
              }
            }

            // Post welcome / info message on PR open
            if (action === 'opened') {
              try {
                const mentionList = assignableReviewers.length > 0
                  ? assignableReviewers.map(u => `@${u}`).join(' and ')
                  : 'maintainers';

                const welcomeBody = `👋 Welcome @${prAuthor}! Thank you for opening your pull request on the **OSS Shopping Cart** project!\n\n` +
                  `🔍 Maintainer review has been requested from ${mentionList}.\n\n` +
                  `📋 **Next steps & Policy:**\n` +
                  `- Automated CI checks (Prettier formatting, ESLint code quality, automated test suite) are triggered automatically without requiring approval.\n` +
                  `- All pull requests require manual review and approval from repository maintainers before merge.\n` +
                  `- Recognized contributors do not have auto-approval; every pull request is reviewed by maintainers to maintain quality. 🚀`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: welcomeBody
                });
              } catch (e) {
                core.warning(`Could not post welcome comment: ${e.message}`);
              }
            }
